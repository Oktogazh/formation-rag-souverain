# Environnement de la formation « RAG et fine-tuning d'un LLM » — PLB, session 2.
#
#   conda env create -f environment.yml
#   conda activate formation-rag-souverain
#   python tp.py check
#
# Tout tourne en local : le modèle de langue et les embeddings dans Ollama, le
# fine-tuning sur processeur, MLflow sur la machine. Aucun service en ligne.
name: formation-rag-souverain
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # Parler au modèle : l'interface compatible OpenAI, servie par Ollama en local
      - openai>=1.50,<3
      - numpy>=1.26,<3
      # Agents (TP 3)
      - langchain>=1.0,<2
      - langchain-ollama>=1.0,<2
      - langgraph>=1.0,<2
      # Mise en service (TP 5)
      - fastapi>=0.115,<1
      - uvicorn>=0.30,<1
      - httpx>=0.27,<1
      # Fine-tuning sur processeur (TP 4, 6) — aucun GPU requis
      - torch>=2.4,<3
      - transformers>=4.45,<6
      - peft>=0.13,<1
      # Suivi des expériences (TP 6)
      - mlflow>=3.0,<4
      # Notebooks
      - jupyterlab>=4.2,<5
      - ipykernel>=6.29,<7
      # Outillage du formateur
      - jupytext>=1.16,<2
      - nbclient>=0.10,<1
      - pytest>=8,<10
